<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none" role="img" aria-label="MiniMax Token Plan quota pill in the DeepSeek Harness composer footer, with an expanded panel showing the five-hour and weekly remaining quota">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B6BFB" />
      <stop offset="1" stop-color="#00C2A8" />
    </linearGradient>
    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4B6BFB" stop-opacity="0.85" />
      <stop offset="1" stop-color="#00C2A8" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- composer surface -->
  <rect x="40" y="150" width="260" height="92" rx="16" stroke="#7C8798" stroke-width="2" />
  <rect x="40" y="150" width="260" height="92" rx="16" stroke="#7C8798" stroke-width="2" opacity="0.35" transform="translate(0,0)" />

  <!-- sibling usage pill -->
  <rect x="58" y="182" width="66" height="28" rx="10" stroke="#7C8798" stroke-width="2" />
  <ellipse cx="74" cy="189" rx="6" ry="2.6" stroke="#9AA5B6" stroke-width="2" />
  <path d="M68 189v14a6 2.6 0 0 0 12 0v-14" stroke="#9AA5B6" stroke-width="2" />
  <rect x="88" y="192" width="26" height="4" rx="2" fill="#9AA5B6" />
  <rect x="88" y="200" width="18" height="4" rx="2" fill="#9AA5B6" />

  <!-- minimax quota pill (highlighted) -->
  <rect x="134" y="178" width="96" height="36" rx="18" fill="url(#accent)" />
  <path d="M150 199a11 11 0 1 1 15 0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M157.5 193.5l4.5 5.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <rect x="172" y="192" width="34" height="5" rx="2.5" fill="#FFFFFF" opacity="0.92" />
  <rect x="172" y="202" width="22" height="4" rx="2" fill="#FFFFFF" opacity="0.65" />

  <!-- context ring -->
  <circle cx="268" cy="196" r="14" stroke="#7C8798" stroke-width="3" opacity="0.5" />
  <path d="M268 182a14 14 0 0 1 12.1 21" stroke="url(#accentSoft)" stroke-width="3" stroke-linecap="round" />

  <!-- connector from the pill to the expanded panel -->
  <path d="M230 196h26" stroke="#7C8798" stroke-width="2" stroke-dasharray="4 5" opacity="0.7" />
  <path d="M282 196c22 0 26-30 48-30" stroke="#7C8798" stroke-width="2" stroke-dasharray="4 5" opacity="0.7" />

  <!-- expanded panel -->
  <rect x="336" y="42" width="264" height="236" rx="18" stroke="#7C8798" stroke-width="2" />

  <!-- panel headline -->
  <circle cx="366" cy="72" r="13" stroke="url(#accentSoft)" stroke-width="3" />
  <path d="M366 60v6" stroke="#7C8798" stroke-width="2" stroke-linecap="round" />
  <rect x="392" y="60" width="116" height="9" rx="4.5" fill="#9AA5B6" />
  <rect x="392" y="75" width="72" height="7" rx="3.5" fill="#7C8798" />
  <rect x="540" y="58" width="44" height="18" rx="9" fill="url(#accent)" />
  <rect x="546" y="65" width="32" height="4" rx="2" fill="#FFFFFF" opacity="0.9" />

  <!-- divider -->
  <path d="M356 100h224" stroke="#7C8798" stroke-width="1.5" opacity="0.55" />

  <!-- details grid: five rows -->
  <g>
    <rect x="356" y="114" width="62" height="6" rx="3" fill="#7C8798" />
    <rect x="516" y="113" width="64" height="8" rx="4" fill="url(#accentSoft)" />
    <rect x="356" y="136" width="78" height="6" rx="3" fill="#7C8798" />
    <rect x="502" y="135" width="78" height="8" rx="4" fill="#9AA5B6" />
    <rect x="356" y="158" width="54" height="6" rx="3" fill="#7C8798" />
    <rect x="526" y="157" width="54" height="8" rx="4" fill="#9AA5B6" />
    <rect x="356" y="180" width="88" height="6" rx="3" fill="#7C8798" />
    <rect x="512" y="179" width="68" height="8" rx="4" fill="#9AA5B6" />
    <rect x="356" y="202" width="46" height="6" rx="3" fill="#7C8798" />
    <rect x="534" y="201" width="46" height="8" rx="4" fill="#9AA5B6" />
  </g>

  <!-- per-model rows -->
  <g opacity="0.85">
    <rect x="356" y="222" width="44" height="6" rx="3" fill="#9AA5B6" />
    <rect x="410" y="221" width="120" height="8" rx="4" fill="#7C8798" />
    <rect x="540" y="221" width="40" height="8" rx="4" fill="url(#accentSoft)" />
  </g>

  <!-- settings block -->
  <path d="M356 244h224" stroke="#7C8798" stroke-width="1.5" opacity="0.55" />
  <rect x="356" y="252" width="140" height="18" rx="9" stroke="#7C8798" stroke-width="2" />
  <circle cx="368" cy="261" r="2.4" fill="#9AA5B6" />
  <circle cx="376" cy="261" r="2.4" fill="#9AA5B6" />
  <circle cx="384" cy="261" r="2.4" fill="#9AA5B6" />
  <rect x="508" y="252" width="36" height="18" rx="9" stroke="#7C8798" stroke-width="2" />
  <rect x="552" y="252" width="40" height="18" rx="9" fill="url(#accent)" />
</svg>
